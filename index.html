<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10243a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="La Popote">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/popote-192.png">
  <title>La Popote</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#10243a;font-family:Arial,sans-serif;overflow:hidden}
    .app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    header{height:44px;flex:0 0 44px;background:#10243a;color:#f6d98e;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;letter-spacing:2px}
    iframe{border:0;width:100%;flex:1;background:#f4f5f7;min-height:0}
    .error{color:white;text-align:center;padding:28px;line-height:1.5}
  </style>
</head>
<body>
  <main class="app">
    <header>LA POPOTE</header>
    <iframe id="popote" title="Application La Popote" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    // Remplacer cette URL par l'URL du NOUVEAU déploiement de test Apps Script.
    const APP_URL = 'https://script.google.com/macros/s/AKfycbyMNfp7ryTloTA-7FbStUCuhM8_PmKmAPy_BbmhQ3MWyKky8MJXY5FMPCx3Xr_2dE57lg/exec';
    const frame = document.getElementById('popote');
    if (APP_URL.startsWith('https://script.google.com/macros/s/')) frame.src = APP_URL;
    else document.querySelector('.app').innerHTML = '<div class="error"><h2>Configuration à terminer</h2><p>Ajoutez l’URL du nouveau déploiement Apps Script dans index.html, puis publiez à nouveau le site GitHub Pages.</p></div>';
    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
</html>
